<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Interactive Simulator - Offline</title>
    <style>
        /* =========================================
           CSS VARIABLES & RESET
           ========================================= */
        :root {
            --primary-color: #003366;
            --secondary-color: #0056b3;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --text-light: #555;
            --correct-color: #198754;
            --correct-bg: #d1e7dd;
            --incorrect-color: #dc3545;
            --incorrect-bg: #f8d7da;
            --border-color: #ccc;
            --container-bg: #ffffff;
            --border-radius: 8px;
        }
        /* =========================================
        IPAD COMPATIBILITY OVERRIDES
        ========================================= */
        label, select, input, tr, td, .options-group, .task-image, audio {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* =========================================
           NAVIGATION
           ========================================= */
        .top-nav {
            background-color: var(--primary-color);
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .top-nav button {
            background: transparent;
            border: 2px solid transparent;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .top-nav button.active, .top-nav button:hover {
            border-color: white;
            background-color: rgba(255,255,255,0.1);
        }

        .sub-nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem;
            background-color: #e9ecef;
            margin-bottom: 2rem;
        }

        .sub-nav button {
            background: none;
            border: none;
            font-size: 1.05rem;
            cursor: pointer;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            padding-bottom: 5px;
            transition: all 0.3s ease;
        }

        .sub-nav button.active, .sub-nav button:hover {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            font-weight: bold;
        }

        /* =========================================
           MAIN CONTAINER & LAYOUT
           ========================================= */
        .container {
            max-width: 1100px;
            margin: 0 auto 3rem auto;
            padding: 2rem;
            background: var(--container-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            min-height: 60vh;
        }

        .task-header {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .task-header h2 {
            color: var(--primary-color);
        }

        /* =========================================
           READING & LISTENING ELEMENTS
           ========================================= */
        .reading-text {
            background: #fdfdfd;
            padding: 1.5rem;
            border-left: 5px solid var(--secondary-color);
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 2rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
            font-size: 1rem;
            line-height: 1.8;
        }

        .audio-container {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        audio {
            width: 100%;
            outline: none;
        }

        details {
            background: #f1f3f5;
            padding: 0.8rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
        }

        summary {
            font-weight: bold;
            cursor: pointer;
            color: var(--primary-color);
        }

        /* =========================================
           INTERACTIVE QUESTIONS & FORMS
           ========================================= */
        .question-block {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: var(--border-radius);
            transition: background-color 0.3s ease;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        /* Inputs */
        input[type="text"], select {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            width: 100%;
            max-width: 350px;
            margin-top: 0.5rem;
        }

        /* Radio & Checkbox */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .options-group label {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        /* Custom Tables for IELTS */
        .ielts-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }
        .ielts-table th, .ielts-table td {
            border: 1px solid var(--border-color);
            padding: 1rem;
            text-align: left;
        }
        .ielts-table th {
            background-color: #f1f3f5;
        }

        /* Images (Map Labelling) */
        .task-image {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 1rem;
            display: block;
        }

        /* =========================================
           VALIDATION STATES (EXAMINER FEEDBACK)
           ========================================= */
        .correct-bg {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
        }

        .incorrect-bg {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-color) !important;
        }

        .feedback-icon {
            font-weight: bold;
            margin-left: 10px;
        }
        .correct-bg .feedback-icon::after { content: ' ✔'; color: var(--correct-color); }
        .incorrect-bg .feedback-icon::after { content: ' ✘'; color: var(--incorrect-color); }

        /* =========================================
           ACTION BUTTONS
           ========================================= */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-nav {
            background: #e2e6ea;
            color: var(--text-color);
        }

        .btn-nav:hover:not(:disabled) {
            background: #dae0e5;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-check {
            background: var(--primary-color);
            color: white;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
        }

        .btn-check:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* =========================================
           DYNAMIC RENDERING (SPA)
           ========================================= */
        #content-area {
            display: none;
        }
        #content-area.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }
        
        .static-section {
            display: none;
            text-align: center;
            padding: 3rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Main Navigation -->
    <nav class="top-nav">
        <button class="nav-btn active" onclick="setSection('listening', this)">Listening</button>
        <button class="nav-btn" onclick="setSection('reading', this)">Reading</button>

        <button class="nav-btn" onclick="setSection('speaking', this)">Speaking</button>
    </nav>

    <!-- Sub Navigation for Practice/Exercises -->
    <div class="sub-nav" id="sub-nav-container">

        <button id="tab-exercises" class="sub-nav-btn" onclick="setMode('exercises')">Exercises</button>
    </div>

    <!-- Main App Container -->
    <div class="container" id="app-container">
        
        <!-- Dynamic Content Area for Listening & Reading -->
        <div id="content-area" class="active">
            <!-- JavaScript will inject tasks here -->
        </div>

        <!-- Interactive Writing Section -->
        <div id="writing-area" class="static-section" style="text-align: left; padding: 1rem 2rem;">
        <h2 style="color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">IELTS Writing Simulator</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 1.5rem;">
        <!-- Columna Izquierda: Tarea y Caja de Escritura -->
        <div>
        <div style="background: #fafafa; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); margin-bottom: 1rem;">
        <h4 style="color: var(--primary-color);" id="writing-task-title">Task 1: Academic Report</h4>
        <p id="writing-task-prompt" style="font-style: italic; margin-top: 0.5rem; font-size: 0.95rem; line-height: 1.5;"></p>
        </div>
        <textarea id="writing-textarea" placeholder="Comienza a escribir tu ensayo aquí..." style="width: 100%; height: 320px; padding: 1rem; border-radius: 4px; border: 1px solid var(--border-color); font-size: 1rem; font-family: inherit; resize: vertical;" oninput="updateWordCount()"></textarea>
        <div style="display: flex; justify-content: space-between; margin-top: 0.5rem; font-weight: bold;">
        <span>Words: <span id="writing-word-count">0</span></span>
        <span id="writing-target-status" style="color: var(--incorrect-color);">Faltan palabras</span>
        </div>
        
        <!-- BOTONES CORREGIDOS Y ALINEADOS -->
        <div style="margin-top: 1.5rem; display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between;">
        <div id="writing-task-buttons" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
        <div style="display: flex; gap: 10px;">
        <button class="btn btn-check" style="padding: 0.6rem 1.5rem; font-size: 1rem;" onclick="checkWritingLocally()">Compare with Model</button>
        <button class="btn" style="background: #198754; color: white; padding: 0.6rem 1.5rem; font-size: 1rem;" onclick="analyzeWithFreeAI()">AI Evaluation</button>
        </div>
        </div>
        </div>

        <!-- Columna Derecha: Panel de Resultados y Feedback -->
        <div>
        <div id="writing-feedback-panel" style="background: #fff; border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 1.5rem; height: 500px; overflow-y: auto;">
        <h4 style="color: var(--text-light); text-align: center; margin-top: 6rem; font-weight: normal;">Tu evaluación por criterios y el ensayo modelo Banda 9.0 aparecerán en este panel.</h4>
        </div>
        </div>
        </div>
        </div>
        <!-- Static Placeholder for Speaking -->
        <div id="speaking-area" class="static-section">
            <h2 style="color: var(--primary-color); margin-bottom: 1rem;">Speaking Section</h2>
            <p>Esta sección está reservada para futuras actualizaciones. (Próximamente)</p>
        </div>

        <!-- Navigation Actions -->
        <div class="actions" id="actions-container">
            <button class="btn btn-nav" id="btn-prev" onclick="changeTask(-1)">&#8592; Previous</button>
            <button class="btn btn-check" onclick="checkAnswers()">Check Answers</button>
            <button class="btn btn-nav" id="btn-next" onclick="changeTask(1)">Next &#8594;</button>
        </div>
    </div>

                        transcript: `<p><strong>Clerk:</strong> Good morning Travel Link. How can I help you?</p>

                                     <p><strong>Clerk:</strong> Right. So, that's Bayswater to Harbor City. Are you planning to travel by bus or train?</p>
                                     <p><strong>Man:</strong> I don't mind really. Whichever option is faster, I suppose.</p>
                                     <p><strong>Clerk:</strong> Well, if you catch a railway express, that'll get you there in under an hour... if you can make the 9:30 a.m. express, I'd recommend you do that.</p>
                                     <p><strong>Man:</strong> Great. Which station does that leave from?</p>
                                     <p><strong>Clerk:</strong> Helendale is the nearest train station to you... That's H-E-L-E-N-D-A-L-E.</p>

                                     <p><strong>Man:</strong> Okay. Which bus is that?</p>
                                     <p><strong>Clerk:</strong> The 792 will take you to the station... The 8:55 is probably safer than the 9:05.</p>

                        transcript: `<p><strong>Administrator:</strong> Hello everyone. I'm the counseling administrator here at St Ives College... We have three professional counselors here... Louise Bagshaw, Tony Denby, and Naomi Flynn.</p>
                                     <p>If you've never used a counselor before, then you should make an appointment with Naomi Flynn. Naomi specializes in seeing new students... Naomi is also the best option for students who can only see a counselor outside office hours... starts early on Wednesday mornings and works late on Thursday evenings.</p>
                                     <p>Louise staffs our drop-in center throughout the day. If you need to see someone without a prior appointment, then she is the one to visit.</p>
                                     <p>Tony is our newest addition... he has an extensive background in stress management and relaxation techniques. We encourage anyone who is trying to deal with anxiety to see him.</p>
                                     <p>Each semester the counseling team runs a number of small group workshops... Our first workshop is called 'Adjusting'... we're targeting first-year students.</p>
                                     <p>'Getting organized'... discover the right balance between academic and recreational activities.</p>
                                     <p>Next up is a workshop called 'Communicating'... We'll cover all aspects of multicultural communication. International students tend to get a lot out of this class.</p>

                        src: "LISTENING/Exercises/Audios/Free IELTS Practice Listening Test - Part 3 Take IELTS.ogg",
                        transcript: `<p><strong>Tutor:</strong> Hello Lorna, Ian. Glad you could make it... I want to run over some aspects of the novel The Secret Garden with you before the test next week.</p>
                                     <p><strong>Tutor:</strong> So the story follows two key characters... Mary Lennox and Colin Craven. The story is set shortly after the turn of the 20th century...</p>
                                     <p><strong>Lorna:</strong> Well, in the beginning, she is an angry, rude child who was orphaned... And there she meets Colin, who spends his days in an isolated room, believing himself to be permanently crippled with no hope of ever gaining the ability to walk.</p>
                                     <p><strong>Tutor:</strong> ...This story, for example, is written from the perspective of what is called an omniscient narrator... we get to see how all the characters feel about things, what they like and don't like, and what their motivations are in the story.</p>
                                     <p><strong>Tutor:</strong> Symbols are things, right? Material things like objects that stand for abstract ideas. Absolutely. Yes. And the author uses many of them. There's the robin redbreast, for example... Roses are used as well as a personal symbol for Mistress Craven... And Mistress Craven's portrait can also be interpreted as a symbol of her spirit.</p>
                                     <p><strong>Tutor:</strong> Motifs are simply recurring elements of the story that support the mood... The Garden of Eden is a motif... And then you've got the role that secrets play... slowly the characters share their secrets and in the process move from darkness to lightness metaphorically...</p>
                                     <p><strong>Tutor:</strong> The Secret Garden has a few themes that all center on the idea of connections... health can determine and be determined by our outlook on life... the author also examines the link between our environment and our physical and emotional prosperity... Finally, this book looks at connections between individuals, namely Mary and Colin. This necessity of human companionship is the novel's most significant theme...</p>`,

                        src: "LISTENING/Exercises/Audios/Free IELTS Practice Listening Test - Part 4 Take IELTS.ogg",
                        transcript: `<p><strong>Lecturer:</strong> Today I'm going to be talking about time... According to social psychologists, there are six ways of thinking about time which are called personal time zones.</p>
                                     <p>The first two are based in the past. Past positive thinkers spend most of their time in a state of nostalgia... People living in the past negative time zone are also absorbed by earlier times but they focus on all the bad things, regrets, failures, poor decisions.</p>
                                     <p>Then we have people who live in the present. Present hedonists are driven by pleasure and immediate sensation... Present fatalists live in the moment too. But they believe this moment is the product of circumstances entirely beyond their control. It's their fate.</p>
                                     <p>Looking at the future time zone, we can see that people classified as future active are the planners and go-getters... A second future orientated perspective, future fatalistic, is driven by the certainty of life after death and some kind of a judgment day when they will be assessed on how virtuously they have lived and what success they have had in their lives.</p>
                                     <p>Everyone is brought into this world as a present hedonist. No exceptions... But did you know that every 9 seconds a child in the USA drops out of school? For boys, the rate is much higher than for girls... The research suggests that they'll never fit in the traditional classroom because these boys require a situation where they have the ability to manage their own learning environment.</p>
                                     <p>Now, let's look at the way we do prevention education... But with present-orientated kids, that just doesn't work. Although they understand the potentially negative consequences of their actions, they persist with the behavior because they're not living for the future.</p>
                                     <p>When Americans are asked how busy they are, the vast majority report being busier than ever before... But when they're asked what they would do with an 8-day week, they say, "Oh, that would be great. They would spend that time laboring away to achieve more."</p>
                                     <p>Seeing these conflicts as differences in time perspective rather than distinctions of character can facilitate more effective cooperation between people...</p>`,

                        title: "2. Railway Season Tickets",
                        type: "reading",
                        content: `<p><strong>Types of Season Tickets</strong></p>
                                  <p><strong>Standard season tickets</strong> allow unlimited travel between the two train stations shown on the ticket for the full duration of their validity. You can break your journey at any train station between the origin and destination station on your season ticket.</p>
                                  <p><strong>Combined rail-and-bus season tickets</strong> are available from some rail stations. This means if you can make your main journey by rail, you can then complete it by bus. Two separate season tickets may be required for some destinations.</p>
                                  <p><strong>Ticket Duration</strong></p>
                                  <p><strong>7-day:</strong> These normally cost less than five standard day-returns. They are valid for a full seven days' rail travel between the points shown on the train ticket.</p>
                                  <p><strong>Monthly:</strong> Monthly season tickets are priced at less than four times the cost of 7-day train tickets and are valid for a full calendar month from the date of commencement.</p>
                                  <p><strong>Annual Card:</strong> This gives you a full calendar year's weekday travel for the price of only 40 weekly tickets. Annual Card holders can also save a third on the price of most Standard Class train fares in the region at weekends and on Bank Holidays. You can also take up to three adults with you at the same discount, while up to four children (aged 5-15) may accompany you for a minimum of £1 each.</p>
                                  <p><strong>How do I buy my first season ticket?</strong></p>
                                  <p>Your season ticket is not valid without a photocard, and both must always be carried together. A photocard will be issued to you free of charge when you first purchase a season ticket. You just need to take a passport-sized photograph to a ticket office and we'll do the rest. As long as your photo remains a good likeness, you can continue to use the photocard with any subsequent season tickets that you buy.</p>`,

                        type: "reading",
                        content: `<p><strong>ACCIDENT INSURANCE FOR CITY MEDIA EMPLOYEES</strong></p>
                                  <p>City Media is pleased to offer its employees accident insurance benefits which are unique in the industry. Our insurance package not only insures employees against accidents occurring on the job, but extends to their off-hours. It also provides 24-hour protection to dependants and to eligible partners. A general description of the accident insurance package is shown below. Any questions regarding it may be referred to our Human Resources Department.</p>
                                  <p>Our basic insurance is the same for all employees, and City Media makes enrolling in this program a condition of employment. We make an exception for those who have the same or greater coverage in an alternate plan. However, employees with other plans are still able to have adult dependants enrolled in ours. At this time, City Media does not extend this insurance to temporary staff, whether they are under contract for their services or not.</p>
                                  <p>Further, employees can usually purchase accident insurance for their partners. However, submission and review of an application to the insurance company will determine whether the partner is eligible to participate. The terms in these policies bought for spouses are identical to those in the employees' policy. This is, of course, provided that he/she has no accident insurance under another plan.</p>
                                  <p>Accident benefits take effect after completing three months of employment. Full-time employees will then automatically receive the minimum $80,000 worth of protection. Part-time employees, defined as those scheduled to work less than forty hours per week, will also be offered accident protection, but the amount of this coverage depends on the hours they typically work.</p>
                                  <p>Additional insurance is optional and is sold in amounts of $25,000 and capped at $100,000. Anyone who is interested can submit a request to purchase it and will be responsible for the premium as well as the fees to administer it.</p>
                                  <p>If employees take an extended time off work on leave, they can either decide not to carry accident insurance or they can decide to keep it and pay 100% of the expense. Basic insurance protection resumes on the first day of the return to work; however, the optional coverages that are discontinued during this time are not automatically restored. These coverages will resume after a medical, a letter from the doctor, and an assurance that the insurance carrier is satisfied.</p>

                            content: `<p><strong>Political units in the history of West Africa</strong></p>
                                    <p>Some of Africa's earliest substantial masonry structures outside Egypt were built in West Africa. The fact that they were constructed demonstrates the existence of a sedentary and complex political unit. At Dhar Tichitt and Dhar Oualata, in modern Mauritania, a new chiefdom developed (around 2000-800 BC)... Evidence points to the importance of mixed farming - both crops and animals. Inorganic wealth lay in beads, bracelets and small stone axes. Unfortunately, none of the region's many tumuli have yet been excavated. It would appear that the collapse of Tichitt-Oualata around 800 BC was brought about both by the increasing drying of the earth...</p>
                                    <p>Undoubtedly, the Middle Niger's best-excavated site is that of Jenné-Jeno (250 BC to AD 1400)... The occupation of such sites continued through the time of Ghana's Islamic successor states...</p>
                                    <p>While Jenné-Jeno was flourishing, spectacular developments were also taking place in the West African forest. Although limited excavations have only begun to hint at the political organization of Nigerian societies during the late first millennium AD, their richness and artistic expertise have been well demonstrated at the site of Igbo-Ukwu. Here an elaborate burial and a storehouse of regalia have been excavated...</p>
                                    <p>Ife, perched at the edge of Nigeria's forest, is thought to have come to prominence through its control of local products - including ivory, gold and pepper - in external trade. By AD 1300, its walled capital was at the peak of its wealth, with many shrines featuring elaborate pavements made of pieces of pottery, and a rich tradition of creating brass and terracotta sculptures... The population lived on animal products, and crops such as vegetables.</p>`,

                            content: `<p><strong>ROBOTS AT WORK</strong></p>
                                    <p><strong>Paragraph 1:</strong> The newspaper production process has come a long way... The daily paper is compiled at the editorial headquarters, known as the pre-press centre, in the heart of the city, but printed far away in the suburbs at the printing centre.</p>

                                    <p><strong>Paragraph 3:</strong> The robots' principal job, however, is to shift the newsprint (the printing paper) that arrives at the plant in huge reels... The LGVs collect the appropriate size paper reels and take them where they have to go... At the stripping station the tough wrapping that helps to protect a reel of paper from rough handling is removed. Any damaged paper is peeled off and the reel is then weighed.</p>

                                    <p><strong>Paragraph 5:</strong> The LGVs move at walking speed. Should anyone step in front of one or get too close, sensors stop the vehicle until the path is clear. The company has chosen a laser-guide function system for the vehicles because... 'if you want to change the routes, you can work out a new route on your computer and lay it down for them to follow'.</p>

                        type: "reading",
                        content: `<p><strong>Emergency procedures (Revised July 2011)</strong></p>
                                  <p>This applies to all persons on the school campus: In cases of emergency (e.g. fire), find the nearest teacher who will send a messenger at full speed to the Office or inform the Office via phone ext. 99.</p>
                                  <p><strong>Procedure for evacuation</strong></p>
                                  <p>1. Warning of an emergency evacuation will be marked by a number of short bell rings. (In the event of a power failure, this may be a hand-held bell or siren.)<br>
                                  2. All class work will cease immediately.<br>
                                  3. Students will leave their bags, books and other possessions where they are.<br>
                                  4. Teachers will take the class rolls.<br>
                                  5. Classes will vacate the premises using the nearest staircase. If these stairs are inaccessible, use the nearest alternative staircase. Do not use the lifts. Do not run.<br>
                                  6. Each class, under the teacher's supervision, will move in a brisk, orderly fashion to the paved quadrangle area adjacent to the car park.<br>
                                  7. All support staff will do the same.<br>
                                  8. The Marshalling Supervisor, Ms Randall, will be wearing a red cap and she will be waiting there with the master timetable and staff list in her possession.<br>
                                  9. Students assemble in the quad with their teacher at the time of evacuation. The teacher will do a head count and check the roll.<br>
                                  10. Each teacher sends a student to the Supervisor to report whether all students have been accounted for. After checking, students will sit down (in the event of rain or wet pavement they may remain standing).<br>
                                  11. The Supervisor will inform the Office when all staff and students have been accounted for.<br>
                                  12. All students, teaching staff and support personnel remain in the evacuation area until the All Clear signal is given.<br>
                                  13. The All Clear will be a long bell ring or three blasts on the siren.<br>
                                  14. Students will return to class in an orderly manner under teacher guidance.<br>
                                  15. In the event of an emergency occurring during lunch or breaks, students are to assemble in their home-room groups in the quad and await their home-room teacher.</p>
                                  <hr>
                                  <p><strong>Community Education Short Courses: Business</strong></p>
                                  <p><strong>Business Basics:</strong> Gain foundation knowledge for employment in an accounts position with bookkeeping and business basics through to intermediate level; suitable for anyone requiring knowledge from the ground up.<br>
                                  <strong>Bookkeeping:</strong> This course will provide students with a comprehensive understanding of bookkeeping and a great deal of hands-on experience.<br>
                                  <strong>New Enterprise Module:</strong> Understand company structures, tax rates, deductions, employer obligations, profit and loss statements, GST and budgeting for tax.<br>
                                  <strong>Social Networking - the Latest Marketing Tool:</strong> This broad overview gives you the opportunity to analyse what web technologies are available and how they can benefit your organisation.<br>
                                  <strong>Communication:</strong> Take the fear out of talking to large gatherings of people. Gain the public-speaking experience that will empower you with better communication skills and confidence.</p>`,

                        title: "Test 1 - Section 2: Keyboard Operators & Dismissals",
                        type: "reading",
                        content: `<p><strong>Beneficial work practices for the keyboard operator</strong></p>
                                  <p><strong>A)</strong> Sensible work practices are an important factor in the prevention of muscular fatigue; discomfort or pain in the arms, neck, hands or back; or eye strain which can be associated with constant or regular work at a keyboard and visual display unit (VDU).</p>
                                  <p><strong>B)</strong> It is vital that the employer pays attention to the physical setting such as workplace design, the office environment, and placement of monitors as well as the organisation of the work and individual work habits. Operators must be able to recognise work-related health problems and be given the opportunity to participate in the management of these. Operators should take note of and follow the preventive measures outlined below.</p>
                                  <p><strong>C)</strong> The typist must be comfortably accommodated in a chair that is adjustable for height with a back rest that is also easily adjustable both for angle and height. The back rest and sitting ledge (with a curved edge) should preferably be cloth-covered to avoid excessive perspiration.</p>
                                  <p><strong>D)</strong> When the keyboard operator is working from a paper file or manuscript, it should be at the same distance from the eyes as the screen. The most convenient position can be found by using some sort of holder. Individual arrangement will vary according to whether the operator spends more time looking at the VDU or the paper – whichever the eyes are focused on for the majority of time should be put directly in front of the operator.</p>
                                  <p><strong>E)</strong> While keying, it is advisable to have frequent but short pauses of around thirty to sixty seconds to proofread. When doing this, relax your hands. After you have been keying for sixty minutes, you should have a ten minute change of activity. During this spell it is important that you do not remain seated but stand up or walk around. This period could be profitably used to do filing or collect and deliver documents.</p>
                                  <p><strong>F)</strong> Generally, the best position for a VDU is at right angles to the window. If this is not possible then glare from the window can be controlled by blinds, curtains or movable screens. Keep the face of the VDU vertical to avoid glare from overhead lighting.</p>
                                  <p><strong>G)</strong> Unsatisfactory work practices or working conditions may result in aches or pain. Symptoms should be reported to your supervisor early on so that the cause of the trouble can be corrected and the operator should seek medical attention.</p>
                                  <hr>
                                  <p><strong>Workplace dismissals</strong></p>
                                  <p><strong>Before the dismissal:</strong> If an employer wants to dismiss an employee, there is a process to be followed. Instances of minor misconduct and poor performance must first be addressed through some preliminary steps. Firstly, you should be given an improvement note. This will explain the problem, outline any necessary changes and offer some assistance in correcting the situation. Then, if your employer does not think your performance has improved, you may be given a written warning. The last step is called a final written warning which will inform you that you will be dismissed unless there are improvements in performance. If there is no improvement, your employer can begin the dismissal procedure. The dismissal procedure begins with a letter from the employer setting out the charges made against the employee. The employee will be invited to a meeting to discuss these accusations. If the employee denies the charges, he is given the opportunity to appear at a formal appeal hearing in front of a different manager. After this, a decision is made as to whether the employee will be let go or not.</p>
                                  <p><strong>Dismissals:</strong> Of the various types of dismissal, a fair dismissal is the best kind if an employer wants an employee out of the workplace. A fair dismissal is legally and contractually strong and it means all the necessary procedures have been correctly followed. In cases where an employee's misconduct has been very serious, however, an employer may not have to follow all of these procedures. If the employer can prove that the employee's behaviour was illegal, dangerous or severely wrong, the employee can be dismissed immediately: a procedure known as summary dismissal.</p>
                                  <p>Sometimes a dismissal is not considered to have taken place fairly. One of these types is wrongful dismissal and involves a breach of contract by the employer. This could involve dismissing an employee without notice or without following proper disciplinary and dismissal procedures. Another type, unfair dismissal, is when an employee is sacked without good cause. There is another kind of dismissal, known as constructive dismissal, which is slightly peculiar because the employee is not actually openly dismissed by the employer. In this case the employee is forced into resigning by an employer who tries to make significant changes to the original contract. This could mean an employee might have to work night shifts after originally signing on for day work, or he could be made to work in dangerous conditions.</p>`,

                        title: "Test 1 - Section 3: Calisthenics",
                        type: "reading",
                        content: `<p><strong>Calisthenics: The world's oldest form of resistance training</strong></p>
                                  <p><strong>A)</strong> From the very first caveman to scale a tree or hang from a cliff face, to the mighty armies of the Greco-Roman empires and the gymnasiums of modern American high schools, calisthenics has endured and thrived because of its simplicity and utility. Unlike strength training which involves weights, machines or resistance bands, calisthenics uses only the body's own weight for physical development.</p>
                                  <p><strong>B)</strong> Calisthenics enters the historical record at around 480 B.C., with Herodotus' account of the Battle of Thermopolylae... It turns out their tribal dance was not a superstitious ritual but a form of calisthenics by which they were building awe-inspiring physical strength and endurance.</p>
                                  <p><strong>C)</strong> The Greeks took calisthenics seriously not only as a form of military discipline and strength, but also as an artistic expression of movement and an aesthetically ideal physique. Indeed, the term calisthenics itself is derived from the Greek words for beauty and strength...</p>
                                  <p><strong>D)</strong> Calisthenics experienced its second golden age in the 1800s. This century saw the birth of gymnastics... This period is also when the phenomena of strongmen developed. These were people of astounding physical strength and development who forged nomadic careers by demonstrating outlandish feats of strength to stunned populations...</p>
                                  <p><strong>E)</strong> In the 1950s, Angelo Siciliano – who went by the stage name Charles Atlas – was crowned "The World's Most Perfectly Developed Man"... But Atlas was the last of a dying breed. The tides were turning, fitness methods were drifting away from calisthenics, and no widely-regarded proponent of the method would ever succeed him.</p>
                                  <p><strong>F)</strong> In the 1960s and 1970s calisthenics and the goal of functional strength combined with physical beauty was replaced by an emphasis on huge muscles at any cost. This became the sport of body building... Physical development of this nature was only attainable through the use of anabolic steroids, synthetic hormones which boosted muscle development while harming overall health...</p>
                                  <p><strong>G)</strong> In this "bigger is better" climate, calisthenics was relegated to groups perceived to be vulnerable, such as women, people recuperating from injuries and school students... Those who mastered the rudimentary skills of calisthenics could expect to graduate to weight training rather than advanced calisthenics.</p>
                                  <p><strong>H)</strong> In recent years, however, fitness trends have been shifting back toward the use of calisthenics. Bodybuilding approaches that promote excessive muscle development frequently lead to joint pain, injuries, unbalanced physiques and weak cardiovascular health. As a result, many of the newest and most popular gyms and programmes emphasise calisthenics-based methods instead. Modern practices often combine elements from a number of related traditions such as yoga, Pilates, kettle-ball training, gymnastics and traditional Greco-Roman calisthenics...</p>`,

                        title: "Test 2 - Section 1: Volunteers & Camping",
                        type: "reading",
                        content: `<p><strong>Volunteers</strong></p>
                                  <p>Thank you for volunteering to work one-on-one with some of the students at our school who need extra help.</p>
                                  <p><strong>Smoking policy:</strong> Smoking is prohibited by law in the classrooms and anywhere on the school grounds.</p>
                                  <p><strong>Safety and Health:</strong> Volunteers are responsible for their own personal safety and should notify the school of any pre-existing medical conditions. Prescription and any other medications that you normally carry with you must be handed in to the school nurse on arrival and collected on departure. If you require them, the nurse will dispense them to you in her office.</p>
                                  <p><strong>Sign-in:</strong> A sign-in book is located at office reception. Please sign this register every time you come to the school. This is important for insurance purposes and emergency situations...</p>
                                  <p><strong>Messages:</strong> Teachers will communicate with volunteers via telephone, email or messages left at the office. Always ask for messages. You may communicate with teachers in the same way – the preferred method is to leave a memo in the relevant teacher's pigeonhole...</p>
                                  <p><strong>Work hours:</strong> We understand that your time commitment is entirely voluntary and therefore flexible...</p>
                                  <p><strong>Role of the Co-ordinator:</strong> The Co-ordinator is responsible for matching volunteer tutors with students, organising tutorial rooms, ensuring student attendance and overseeing volunteer tutor training...</p>
                                  <hr>
                                  <p><strong>Camping in the Bush</strong></p>
                                  <p><strong>Planning:</strong> Good planning is the key to safe and successful camping trips. Obtaining a camping permit in advance of leaving to camp out overnight in a national park is obligatory. Bookings are also compulsory for some parks. There could be limits on group sizes in some parks... Always obtain permission from the owner prior to crossing private property.</p>
                                  <p><strong>Equipment:</strong> As well as your usual bushwalking gear, you will need the right equipment for camping. A fuel stove and fuel for cooking is essential... It is recommended that you pitch a free-standing tent which requires few pegs and therefore has less ecological impact. Take a sleeping mat, if you have one, to put your sleeping bag on for a more comfortable night's sleep. You will also need a hand trowel to bury human waste...</p>
                                  <p><strong>Campfires:</strong> The traditional campfire actually causes a huge amount of environmental damage. If you gather firewood, you are removing the vital habitat of insects, reptiles, birds and small mammals... Under no circumstances should you light a fire in the bush.</p>
                                  <p><strong>Campsites:</strong> Erect your tent at an existing site if possible; otherwise try to find a spot where you won't damage vegetation. Never cut branches or move rocks or disturb the soil unnecessarily...</p>
                                  <p><strong>Rubbish:</strong> Remove all rubbish – carry it out with you. Don't attempt to burn or bury rubbish because this creates a fire hazard and/or disturbs the soil... Never feed the local wildlife – carry out all food scraps as these disturb the natural nutrient balance and can create weed problems.</p>`,

                    {
                        title: "Test 2 - Section 2: Employment & Emails",
                        type: "reading",
                        content: `<p><strong>Conditions of employment</strong></p>
                                  <p><strong>Weekly hours of work</strong> – 40 hours per week at the ordinary hourly rate of pay for most full-time employees, plus reasonable additional hours (penalty rates apply). Part-time employees work a regular number of hours and days each week, but fewer hours than full-time workers. Casual employees are employed on an hourly or daily basis.</p>
                                  <p><strong>Entitlements (full-time employees):</strong><br>
                                  <strong>Parental leave</strong> – up to 12 months' unpaid leave for maternity, paternity and adoption related leave.<br>
                                  <strong>Sick leave</strong> – up to 10 days' paid sick leave per year; more than 4 continuous days requires a medical certificate.<br>
                                  <strong>Annual leave</strong> – 4 weeks' paid leave per annum, plus an additional week for shift workers.<br>
                                  <strong>Public holidays</strong> – a paid day off on a public holiday, except where reasonably requested to work. Employees working on public holidays are entitled to 15% above their normal hourly rate.<br>
                                  <strong>Notice of termination</strong> – 2 weeks' notice of termination (3 weeks if the employee is more than 55 years old and has at least 2 years of continuous service).</p>
                                  <p><em>Note: If you work part-time, you should receive all the entitlements of a full-time employee but on a pro-rata or proportional basis. Casual workers have no guarantee of hours to be worked and they do not have to be given advance notice of termination.</em></p>
                                  <hr>
                                  <p><strong>Writing Effective Emails</strong></p>
                                  <p><strong>A)</strong> Like a headline in a newspaper: it should grab the recipient's attention and specify what the message is about – use a few well-chosen words. If the email is one of a series e.g. a weekly newsletter, include the date in the subject line. Never leave it blank.</p>
                                  <p><strong>B)</strong> If you need to email someone about several different issues, write a separate email for each subject. This allows the recipient to reply to each one individually in a timely manner... If you have several related points, put them all in the same email but present each point in a numbered or bulleted paragraph.</p>

                                  <p>When we talk about how films convey meaning we tend to refer to acting, music, dialogue, props and narrative developments, but often forgotten is the visual essence of a film itself, which is the cutting together of moving images...</p>
                                  <p>Most films and many important scenes within them open with an <strong>establishing shot</strong>. Typically this shot precedes our introduction to the main characters by presenting us with the locale in which the scene's action or dialogue is about to occur... In this way, establishing shots can also introduce a film's theme.</p>
                                  <p>After an establishing shot, most directors choose a <strong>long shot</strong> in order to progress the narrative. This type of shot displays the entire human physique in relation to its surroundings... A long shot is therefore often used to centre on a pivotal character in the scene. A film might begin with an establishing shot of bleak, snowy mountains and then cut to a long shot of a lone skier, for example, or a sweeping panorama of a bustling metropolis could segue into a street view of someone entering a building.</p>
                                  <p><strong>Close-up shots</strong> are popular in suspense sequences... Confining the visual field in this way adds to the viewer's apprehension. Dramatic films will probably want to emphasise character interaction. The <strong>third-person shot</strong> – in which a third of the frame consists of a rear view of a person's upper torso and head – can be effectively utilised here.</p>

                            <p>I am quite certain that I left it plugged into the power outlet located on the desk, right next to the bedside lamp. I was working on my laptop until late the night before my departure and simply forgot to pack it in my briefcase the following morning in my rush to catch my flight.</p>
                            <p>I would be highly grateful if you could ask your housekeeping staff to check the room. If the hard drive is found, please contact me immediately at 555-0198. I am more than willing to cover any courier charges required to post the item to my home address via expedited shipping.</p>
                            <p>Thank you for your prompt assistance in this matter.</p>
                            <p>Yours faithfully,<br>Michael Chang</p>`
            },
            {
                title: "Test 2 - Task 2: Equal Salary for All",
                prompt: "Some people believe that everyone should be paid the same salary, regardless of their occupation.[cite: 7]<br><br>To what extent do you agree or disagree?",
                targetWords: 250,
                modelAnswer: `<p><strong>Band 9.0 Model Answer:</strong></p>
                            <p>The idea of implementing a universal, equal salary for all workers, irrespective of their profession, is a radical concept often proposed to eliminate income inequality. While the underlying intention of creating a fairer society is noble, I completely disagree with this approach, as it would destroy individual motivation and devastate the global economy.</p>
                            <p>The most significant argument against equal pay is that it fundamentally undermines the incentive to work hard and pursue higher education. Certain professions, such as neurosurgery, engineering, or law, require a decade or more of rigorous academic training, immense financial investment, and high levels of stress. If a surgeon were paid the exact same wage as a supermarket cashier, there would be no financial motivation for anyone to undertake the grueling preparation required for complex jobs. Consequently, society would face a severe shortage of highly skilled professionals, leading to a collapse in critical sectors like healthcare and technology.</p>
                            <p>Furthermore, compensation based on occupation reflects the level of responsibility and risk associated with a job. A corporate CEO or a commercial airline pilot holds the lives and livelihoods of hundreds of people in their hands on a daily basis. The higher salaries awarded to these positions act as a reflection of the heavy burden they carry and the value they generate. Paying everyone equally ignores the basic economic principles of supply and demand, as well as the intrinsic value of specialized skills.</p>
                            <p>Admittedly, the wage gap between the highest and lowest earners in modern society is often disproportionate, and essential workers like teachers and nurses are frequently underpaid. However, the solution is not to standardize all salaries, but rather to establish higher minimum wages and fairer taxation systems to ensure a decent standard of living for all.</p>
                            <p>In conclusion, paying every individual the same salary regardless of their occupation is an impractical and counterproductive idea. It would eradicate ambition, lead to a shortage of essential experts, and ultimately cripple societal progress. Fair compensation must remain tied to a person's skills, responsibilities, and contributions.</p>`
            }
        ];

        // Interceptamos la navegación del SPA para enganchar la carga interactiva de Writing
        const originalSetSection = setSection;
        setSection = function(section, btn) {
            originalSetSection(section, btn);
            if (section === 'writing') {
                const area = document.getElementById('writing-area');
                if (area) {
                    area.style.display = 'block';
                    // Ocultar controles globales de Listening/Reading si quedan visibles
                    const subNav = document.getElementById('sub-nav');
                    const actions = document.getElementById('actions-container');
                    if (subNav) subNav.style.display = 'none';
                    if (actions) actions.style.display = 'none';
                    
                    initWritingSimulator();
                }
            }
        };

        // Inicializador de la interfaz de Writing
        function initWritingSimulator() {
            if (!ieltsWritingData || ieltsWritingData.length === 0) {
                document.getElementById('writing-feedback-panel').innerHTML = 
                    `<p style="text-align:center; color:var(--text-light); margin-top:5rem;">No hay tareas de escritura cargadas en la base de datos.</p>`;
                return;
            }
            loadWritingTask(currentWritingIndex);
        }

        // Carga los datos de la tarea seleccionada en el DOM
        function loadWritingTask(index) {
            currentWritingIndex = index;
            const task = ieltsWritingData[index];
            
            const titleEl = document.getElementById('writing-task-title');
            const promptEl = document.getElementById('writing-task-prompt');
            const textareaEl = document.getElementById('writing-textarea');
            const feedbackEl = document.getElementById('writing-feedback-panel');
            
            if (titleEl) titleEl.innerText = task.title;
            if (promptEl) promptEl.innerHTML = task.prompt;
            if (textareaEl) textareaEl.value = ""; // Limpiar caja al cambiar de tarea
            
            if (feedbackEl) {
                feedbackEl.innerHTML = `<h4 style="color: var(--text-light); text-align: center; margin-top: 6rem; font-weight: normal;">Tu evaluación por criterios y el ensayo modelo Banda 9.0 aparecerán en este panel.</h4>`;
            }
            
            updateWordCount();
            renderWritingNavigation();
        }

        // Contador de palabras dinámico y validación de objetivos
        function updateWordCount() {
            const textarea = document.getElementById('writing-textarea');
            if (!textarea) return;
            
            const text = textarea.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            const target = ieltsWritingData[currentWritingIndex] ? ieltsWritingData[currentWritingIndex].targetWords : 150;
            
            const countEl = document.getElementById('writing-word-count');
            const statusEl = document.getElementById('writing-target-status');
            
            if (countEl) countEl.innerText = words;
            
            if (statusEl) {
                if (words >= target) {
                    statusEl.innerText = "Target reached!";
                    statusEl.style.color = "var(--correct-color)";
                } else {
                    statusEl.innerText = `Faltan ${target - words} palabras`;
                    statusEl.style.color = "var(--incorrect-color)";
                }
            }
        }

        // Navegación entre las tareas de Writing
        function changeWritingTask(direction) {
            if (currentWritingIndex + direction >= 0 && currentWritingIndex + direction < ieltsWritingData.length) {
                loadWritingTask(currentWritingIndex + direction);
            }
        }

        // Dibuja la botonera interactiva para Writing
         function renderWritingNavigation() {
            const navContainer = document.getElementById('writing-task-buttons');
            if (!navContainer) return;
            
            navContainer.innerHTML = '';
            
            ieltsWritingData.forEach((task, index) => {
                const btn = document.createElement('button');
                
                // Estilo dinámico: resalta el botón si es la tarea actual
                if (index === currentWritingIndex) {
                    btn.style.cssText = "padding: 0.5rem 1rem; background: var(--primary-color); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: default;";
                } else {
                    btn.style.cssText = "padding: 0.5rem 1rem; background: #e9ecef; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; transition: 0.2s;";
                    btn.onmouseover = () => btn.style.background = "#d3d6d8";
                    btn.onmouseout = () => btn.style.background = "#e9ecef";
                }
                
                // Nombres cortos para los botones
                let shortName = "Práctica";
                if (task.title.includes("Test 1")) shortName = "T1";
                if (task.title.includes("Test 2")) shortName = "T2";
                
                btn.innerText = task.title.includes("Task 1") ? `${shortName} - Task 1` : `${shortName} - Task 2`;
                
                // Al hacer clic, carga la tarea exacta
                btn.onclick = () => {
                    loadWritingTask(index);
                };
                
                navContainer.appendChild(btn);
            });
         }

        // Despliega la respuesta modelo incrustada localmente
        function checkWritingLocally() {
            if (!ieltsWritingData[currentWritingIndex]) return;
            const task = ieltsWritingData[currentWritingIndex];
            const panel = document.getElementById('writing-feedback-panel');
            
            if (panel) {
                panel.innerHTML = `
                    <h3 style="color: var(--primary-color); margin-bottom:1rem;">Official Sample Answer</h3>
                    <div style="background: #f8f9fa; padding: 1.2rem; border-left: 4px solid #198754; border-radius: 4px; font-size:0.95rem; line-height:1.6; max-height:320px; overflow-y:auto;">
                        ${task.modelAnswer}
                    </div>
                `;
            }
        }

        async function analyzeWithFreeAI() {
            const panel = document.getElementById('writing-feedback-panel');
            const textarea = document.getElementById('writing-textarea');
            
            if (!textarea || !panel) return;
            
            const essay = textarea.value.trim();
            const task = ieltsWritingData[currentWritingIndex];
        
            if (!essay) {
                alert("Por favor, escribe tu respuesta en el cuadro de texto antes de solicitar la evaluación de la IA.");
                return;
            }
        
            panel.innerHTML = `<h4 style="text-align:center; margin-top:6rem; color: var(--secondary-color); font-weight: normal;">Conectando con el servidor de Gemini... Por favor espera.</h4>`;
        
            // AQUI ESTÁ LA MAGIA: Detectamos si es Task 1 o Task 2
            const isTask1 = task.title.includes("Task 1");
            const taskCriterion = isTask1 ? "Task Achievement" : "Task Response";
        
            // Insertamos el criterio dinámico (${taskCriterion}) dentro del prompt
            const systemPrompt = `Actúas como un examinador oficial experto de IELTS Certificado. Evalúa el siguiente ensayo escrito en base a este enunciado exacto: "${task.prompt}".
            El ensayo del alumno es: "${essay}".
            
            Entrega tu respuesta estructurada en HTML limpio (usa etiquetas <p>, <ul>, <li>, <strong>). Debes incluir de forma estricta:
            1. Overall Band Score (Escala 1.0 a 9.0).
            2. Puntuación desglosada y retroalimentación breve por cada uno de los 4 criterios oficiales de IELTS (${taskCriterion}, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy).
            3. Una sección llamada "Correcciones sugeridas" en formato de lista mostrando el texto original y cómo mejorarlo.
            Responde en español, pero mantén los términos de los criterios y las correcciones en inglés. Importante: No envuelvas tu respuesta en bloques de código markdown.`;
        
            try {
                const response = await fetch("/.netlify/functions/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ promptText: systemPrompt })
                });
        
                const textResponse = await response.text(); 
                
                if (!response.ok) {
                    throw new Error(`Error de Netlify (HTTP ${response.status}): ${textResponse}`);
                }
        
                const data = JSON.parse(textResponse);
                
                if (data.error) {
                    const mensajeReal = data.error.message || JSON.stringify(data.error);
                    throw new Error(`Rechazo de Google: ${mensajeReal}`);
                }
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let resultText = data.candidates[0].content.parts[0].text;
                    resultText = resultText.replace(/```html/g, "").replace(/```/g, "");
                    panel.innerHTML = `<div style="line-height:1.6; font-size:0.95rem;">${resultText}</div>`;
                } else {
                    throw new Error("Respuesta incompleta: " + textResponse.substring(0, 100));
                }
            } catch (error) {
                panel.innerHTML = `
                    <div style="color: var(--incorrect-color); padding: 1.5rem; text-align:left; border: 1px dashed var(--incorrect-color); font-size: 0.95rem; background: #fff3f3;">
                        <strong style="font-size:1.1rem;">Diagnóstico del Servidor:</strong><br><br>
                        <code>${error.message}</code><br><br>
                        <span style="color:#555;">Si el error persiste, revisa tu conexión a internet.</span>
                    </div>`;
            }
        }
    </script>
        
</body>
</html>
